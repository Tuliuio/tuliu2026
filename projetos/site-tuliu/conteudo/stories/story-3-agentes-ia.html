<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentes de IA - Tuliu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(135deg, #f8f8f8 0%, #ffffff 100%);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .story-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 60px;
      text-align: center;
      gap: 40px;
      position: relative;
    }

    .badge {
      display: inline-block;
      background: #000;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      animation: slideDown 0.8s ease;
    }

    .icon-wrapper {
      width: 140px;
      height: 140px;
      background: linear-gradient(135deg, #0a071a 0%, #1a1428 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      animation: scaleIn 0.8s ease 0.2s both;
    }

    .icon-wrapper i {
      color: #fff;
      font-size: 60px;
    }

    .title {
      font-family: 'Caveat', cursive;
      font-size: 52px;
      font-weight: 700;
      color: #0a071a;
      line-height: 1.2;
      animation: fadeIn 0.8s ease 0.4s both;
    }

    .description {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
      max-width: 600px;
      font-weight: 400;
      animation: fadeIn 0.8s ease 0.6s both;
    }

    .cta {
      display: inline-block;
      background: #0a071a;
      color: #fff;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
      animation: slideUp 0.8s ease 0.8s both;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .accent-line {
      width: 60px;
      height: 4px;
      background: #0a071a;
      border-radius: 2px;
      animation: expandWidth 0.8s ease 0.3s both;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes expandWidth {
      from {
        opacity: 0;
        width: 0;
      }
      to {
        opacity: 1;
        width: 60px;
      }
    }

    .watermark {
      position: absolute;
      bottom: 30px;
      right: 30px;
      font-size: 13px;
      color: #999;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="story-container">
    <span class="badge">Serviço 3</span>

    <div class="accent-line"></div>

    <div class="icon-wrapper">
      <i class="fas fa-robot"></i>
    </div>

    <h1 class="title">Agentes<br>de IA</h1>

    <p class="description">
      Desenvolvemos e publicamos agentes inteligentes prontos para atender, vender e automatizar seus processos internos.
    </p>

    <a href="#" class="cta">Quero saber mais</a>

    <div class="watermark">@tuliu.io</div>
  </div>
</body>
</html>
